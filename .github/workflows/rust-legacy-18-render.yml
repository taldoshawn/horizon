name: Legacy 1.8.9 native renderer validation
on:
  push:
    branches:
      - feature/native-1_8_9-wire
    paths:
      - crates/horizon-client-render/src/legacy_chunk.rs
      - crates/horizon-client-render/src/lib.rs
      - crates/horizon-world/src/datafix/mod.rs
      - crates/horizon-protocol/src/legacy_v1_8/**
      - .github/workflows/rust-legacy-18-render.yml
      - Cargo.lock
      - Cargo.toml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Use pinned Rust toolchain
        run: rustup show
      - name: Compile renderer and validate 1.8 numeric chunks
        run: cargo test --locked -p horizon-client-render --lib legacy_chunk -- --nocapture
